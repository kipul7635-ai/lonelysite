<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>the consciousness</title>

    <style>
        body {
            background-color: #111;
            background-image: url("images/background1.png");
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            color: white;
            font-family: monospace;
            text-align: center;
            padding: 50px 20px;
        }

        h1 {
            font-size: 30px;
        }

        /* Intro screen */
        #intro {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            cursor: pointer;
            opacity: 1;
            transition: opacity 1.5s ease;

            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            user-select: none;
            outline: none;
            touch-action: manipulation;
            will-change: opacity;
        }

        #intro span {
            color: #444;
            font-size: 14px;
        }

        #intro.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* Counters */
        #counter,
        #counter-2,
        #counter-3 {
            margin-top: 40px;
            color: #888;
            font-size: 13px;
            line-height: 1.8;
        }

        #counter .days,
        #counter-2 .days,
        #counter-3 .days {
            display: block;
            color: #ccc;
            font-size: 22px;
            letter-spacing: 2px;
        }

        #counter .clock,
        #counter-2 .clock {
            display: block;
            color: #777;
            font-size: 11px;
            letter-spacing: 3px;
            margin-top: 4px;
        }

        /* Floating text */
        .float {
            animation:
                driftX var(--dur-x, 5s)  ease-in-out infinite var(--delay-x, 0s),
                driftY var(--dur-y, 7s)  ease-in-out infinite var(--delay-y, 0s),
                tilt   var(--dur-t, 9s)  ease-in-out infinite var(--delay-t, 0s),
                sway   var(--dur-s, 12s) ease-in-out infinite var(--delay-s, 0s);
            will-change: translate, transform, rotate;

            /* readability box */
            background: rgba(0, 0, 0, 0.65);
            padding: 2px 10px;
            border-radius: 3px;
            box-decoration-break: clone;
            -webkit-box-decoration-break: clone;
        }

        @keyframes driftX {
            0%, 100% { translate: -2px 0; }
            50%      { translate:  2px 0; }
        }

        @keyframes driftY {
            0%, 100% { transform: translateY(-2px); }
            50%      { transform: translateY( 2px); }
        }

        @keyframes tilt {
            0%, 100% { rotate: -1.2deg; }
            50%      { rotate:  1.2deg; }
        }

        @keyframes sway {
            0%, 100% { scale: 1 1; skew: -0.6deg 0deg; }
            50%      { scale: 1 1; skew:  0.6deg 0deg; }
        }

        @media (prefers-reduced-motion: reduce) {
            .float { animation: none; }
        }
    </style>
</head>

<body>

    <div id="intro">
        <span>gaze?</span>
    </div>

    <audio id="music" loop>
        <source src="music/song" type="audio/mpeg">
    </audio>

    <p>this place is quiet, isn't it?</p>

    <div id="counter">
        days since I've gone insane:
        <span class="days" id="days">0</span>
        <span class="clock" id="clock">00 : 00 : 00</span>
    </div>

    <div id="counter-2">
        days since i started being a burden:
        <span class="days" id="burden-days">0</span>
        <span class="clock" id="burden-years">that's 0 years to be precise</span>
    </div>

    <div id="counter-3">
        <span class="days" id="thoughts">0</span>
        thoughts thought of
    </div>

    <script>
        const intro = document.getElementById("intro");
        const music = document.getElementById("music");

        const START_INSANITY = new Date(2026, 9, 1, 0, 0, 0);
        const START_BURDEN   = new Date(2007, 9, 14, 0, 0, 0);

        const daysEl        = document.getElementById("days");
        const clockEl       = document.getElementById("clock");
        const burdenDaysEl  = document.getElementById("burden-days");
        const burdenYearsEl = document.getElementById("burden-years");

        function pad(n) {
            return String(n).padStart(2, "0");
        }

        function tick() {
            const now = Date.now();

            const e1 = Math.max(0, now - START_INSANITY.getTime());
            const s1 = Math.floor(e1 / 1000);

            daysEl.textContent = Math.floor(s1 / 86400);
            clockEl.textContent =
                pad(Math.floor((s1 % 86400) / 3600)) + " : " +
                pad(Math.floor((s1 % 3600) / 60))     + " : " +
                pad(s1 % 60);

            const e2 = Math.max(0, now - START_BURDEN.getTime());
            const s2 = Math.floor(e2 / 1000);
            const years = e2 / (365.25 * 24 * 60 * 60 * 1000);

            burdenDaysEl.textContent  = Math.floor(s2 / 86400);
            burdenYearsEl.textContent = "that's " + years.toFixed(4) + " years to be precise";
        }

        tick();
        setInterval(tick, 1000);

        const thoughtsEl = document.getElementById("thoughts");

        let thoughts = Math.floor(Math.random() * 1_000_001);
        thoughtsEl.textContent = thoughts.toLocaleString();

        function thoughtTick() {
            thoughts++;
            thoughtsEl.textContent = thoughts.toLocaleString();

            const delay = 100 + Math.random() * 900;
            setTimeout(thoughtTick, delay);
        }

        thoughtTick();

        function rand(min, max) {
            return min + Math.random() * (max - min);
        }

        function applyFloat() {
            document.querySelectorAll("body *").forEach(el => {
                const hasOwnText = Array.from(el.childNodes).some(
                    n => n.nodeType === 3 && n.textContent.trim() !== ""
                );
                if (!hasOwnText) return;

                if (getComputedStyle(el).display === "inline") {
                    el.style.display = "inline-block";
                }

                el.classList.add("float");

                el.style.setProperty("--dur-x", rand(4, 7).toFixed(2) + "s");
                el.style.setProperty("--dur-y", rand(5, 8).toFixed(2) + "s");
                el.style.setProperty("--dur-t", rand(7, 12).toFixed(2) + "s");
                el.style.setProperty("--dur-s", rand(10, 16).toFixed(2) + "s");

                el.style.setProperty("--delay-x", (-Math.random() * 20).toFixed(2) + "s");
                el.style.setProperty("--delay-y", (-Math.random() * 20).toFixed(2) + "s");
                el.style.setProperty("--delay-t", (-Math.random() * 20).toFixed(2) + "s");
                el.style.setProperty("--delay-s", (-Math.random() * 30).toFixed(2) + "s");
            });
        }

        applyFloat();

        let started = false;

        intro.addEventListener("click", () => {
            if (started) return;
            started = true;

            document.title = "within the consciousness";

            music.play().catch(error => {
                console.log("Music could not start:", error);
            });

            intro.classList.add("hidden");

            setTimeout(() => {
                intro.remove();
            }, 1600);
        });
    </script>

</body>
</html>
